# DPMtF-LightWorker example configuration (GOAL.md §12).
#
# This file is the §12 example. It is shipped as the example so a
# developer can copy it to worker.yaml and fill in environment-variable
# names that the deployment script exports. Committed configuration
# must contain environment-variable names rather than machine-specific
# absolute paths (§12 closing line).

worker:
  id: svend3060
  display_name: RTX 3060 LightWorker
  max_parallel_executions: 1
  poll_interval_seconds: 10
  heartbeat_interval_seconds: 15

father:
  base_url: http://main5090:9130
  request_timeout_seconds: 30

network:
  type: tailscale
  expected_father_host: main5090

allocator:
  command: model-allocator
  client: opencode
  # A role in the worker's own roles.yaml, used only to prove the allocator
  # configuration loads. Preflight warns rather than fails when unset.
  probe_role: imple01LW
  config_root: ${MODEL_ALLOCATOR_CONFIG_ROOT}
  # The client config `render-config` merges into. It emits only `model` and
  # `provider`; the `permission` block that confines a role to its worktree
  # (§19) has to already be there. This file belongs to this machine's
  # steward -- §19 says the worker must not depend on Father knowing its
  # filesystem -- and `{worktree}` in it is replaced with the execution's
  # worktree, which differs every time.
  #
  # Leave unset and the render produces a config with no permission block,
  # which is refused: an unconfined role is worse than a stopped one.
  base_config: ~/lightworker/opencode-base.json

paths:
  repository_root: ${LIGHTWORKER_REPOSITORY_ROOT}
  worktree_root: ${LIGHTWORKER_WORKTREE_ROOT}
  artifact_root: ${LIGHTWORKER_ARTIFACT_ROOT}
  log_root: ${LIGHTWORKER_LOG_ROOT}
  opencode_config_root: ${LIGHTWORKER_OPENCODE_CONFIG_ROOT}

retention:
  successful_worktree_hours: 1
  failed_worktree_days: 7
  artifact_days: 14
  log_days: 30
